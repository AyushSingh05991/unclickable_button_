<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unclickable Button | Programmer_Deeoak</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        *::selection {
            background: #7d2ae8;
            color: #fff;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #7d2ae8;
            padding: 20px;
        }
        .wrapper {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: auto;
            padding: 20px;
            background: #fff;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }
        i {
            font-size: 6em;
            color: #7d2ae8;
            border: 5px solid transparent;
            outline: 3px solid #7d2ae8;
            border-radius: 50%;
        }
        h2 {
            font-size: 2em;
            color: #7d2ae8;
            margin: 15px 0;
        }
        .btn-group {
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: center;
            margin-top: 15px;
            gap: 10px;
        }
        button {
            width: 40%;
            max-width: 150px;
            height: 100%;
            font-size: 1em;
            color: #fff;
            font-weight: 600;
            border-radius: 30px;
            border: 2px solid #7d2ae8;
            outline: none;
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .3);
        }
        .yes-btn {
            background: #7d2ae8;
        }
        .no-btn {
            background: transparent;
            color: #7d2ae8;
        }
        .credit {
            margin-top: 20px;
            font-size: 14px;
            color: white;
            text-align: center;
        }
        .credit a {
            color: white;
            text-decoration: none;
        }
        .credit a:hover {
            text-decoration: underline;
        }
        @media (max-width: 600px) {
            .wrapper {
                padding: 15px;
            }
            i {
                font-size: 5em;
            }
            h2 {
                font-size: 1.5em;
            }
            .btn-group {
                height: 40px;
            }
            button {
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <i class="fa-solid fa-circle-question"></i>
        <h2 class="question">Are you a girl?</h2>
        <div class="btn-group">
            <button class="yes-btn">Yes</button>
            <button class="no-btn">No</button>
        </div>
    </div>

    <div class="credit">
        Page created by <a href="https://instagram.com/programmer_deepak" target="_blank">programmer Deepak</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
